name: edu-sw
services:
  cloudflare:
    container_name: cloudflare
    image: cloudflare/cloudflared:latest
    profiles: ["edu-sw"]
    command: tunnel --no-autoupdate run --token ${TOKEN_CLOUDFLARED}

  frontend:
    container_name: frontend
    build: ./frontend
    profiles: ["edu-sw"]
    ports:
      - "80:80"
    volumes:
      - ./frontend/dist:/frontend
      - ./.nginx/default.conf:/etc/nginx/conf.d/default.conf

  backend:
    container_name: backend
    build: ./backend
    profiles: ["edu-sw"]
    expose:
      - 6789

  db:
    image: postgres:18
    container_name: postgres_db
    ports:
      - "5432:5432"
    env_file:
      - .env.example
    volumes:
      - db_volume:/var/lib/postgresql/18/docker
      - ./.backup:/backup

  llama-cpp:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda13
    container_name: llama-cpp-server
    profiles: ["llm-server"]
    ports:
      - 9876:9876
    volumes:
      - /mnt/hdd/model-gguf:/models
    command: >
      -m /models/gemma-4/gemma-4-E4B-it-qat-UD-Q4_K_XL.gguf
      -ngl 99
      -t 12
      -b 512
      -ub 256
      -fa on
      --reasoning off
      --ctx-size 8192
      --host 0.0.0.0
      --port 9876
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]  # Modify for multiple GPUs: ["0", "1"]
              capabilities: [gpu]

volumes:
  db_volume: