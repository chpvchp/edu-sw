name: edu-sw
services:
  cloudflare:
    container_name: cloudflare
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token ${TOKEN_CLOUDFLARED}
  frontend:
    container_name: frontend
    build: ./frontend
    ports:
      - "80:80"
    volumes:
      - ./frontend/dist:/frontend
      - ./.nginx/default.conf:/etc/nginx/conf.d/default.conf
  
  backend:
    container_name: backend
    build: ./backend
    expose:
      - 6789

  db:
    image: postgres:18
    container_name: postgres_db
    ports:
      - "5432:5432"
    env_file:
      - .env.example
    volumes:
      - db_volume:/var/lib/postgresql/18/docker
      - ./.backup:/backup

  mineru-api:
    image: mineru:latest
    container_name: mineru-api
    restart: always
    profiles: ["api"]
    ports:
      - 8888:8888
    environment:
      MINERU_MODEL_SOURCE: local
    entrypoint: mineru-api
    command:
      --host 0.0.0.0
      --port 8888
      # --allow-public-http-client  # Disabled by default; when binding to 0.0.0.0 or ::, this re-enables *-http-client backends and server_url. Enable only if you accept the SSRF risk.
      # parameters for vllm-engine
      # --gpu-memory-utilization 0.5  # If encountering VRAM shortage, reduce the KV cache size by this parameter; if VRAM issues persist, try lowering it further to `0.4` or below.
    ulimits:
      memlock: -1
      stack: 67108864
    ipc: host
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]  # Modify for multiple GPUs: ["0", "1"]
              capabilities: [gpu]

volumes:
  db_volume: